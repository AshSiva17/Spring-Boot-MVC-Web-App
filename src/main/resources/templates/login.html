<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Sign In — CourtStat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </head>
    <body class="login-page">
        <header class="site-header">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark">CS</span>
                <span class="logo">CourtStat</span>
            </a>
        </header>
        <main class="login-main">
            <section class="login-card">
                <div class="brand">
                    <span class="brand-mark">CS</span>
                    <span class="logo">CourtStat</span>
                </div>
                <h1>Sign in</h1>
                <p class="subtitle">Access your basketball stats dashboard</p>
                <div class="banner banner-error" th:if="${param.error}">
                    Invalid username and password.
                </div>
                <div class="banner banner-logout" th:if="${param.logout}">
                    You have been logged out.
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input id="username" type="text" name="username" autocomplete="username"/>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" autocomplete="current-password"/>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Sign In</button>
                </form>
            </section>
        </main>
    </body>
</html>
